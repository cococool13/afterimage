name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet run --project Afterimage.Tests
      - name: Bundle ffmpeg
        continue-on-error: true
        run: powershell -File scripts/bundle-ffmpeg.ps1
      - name: Publish
        run: >
          dotnet publish Afterimage.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish
      - name: Sign
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: powershell -File scripts/sign.ps1 publish/Afterimage.exe
      - name: Stage
        run: |
          Copy-Item publish/Afterimage.exe Afterimage.exe
          Compress-Archive -Path Afterimage.exe -DestinationPath Afterimage.zip -Force
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Afterimage.exe
            Afterimage.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
